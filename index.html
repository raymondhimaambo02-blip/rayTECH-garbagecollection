.rate{display:flex;align-items:center;gap:4px;margin-top:12px;flex-wrap:wrap}.rate button{border:0;background:none;font-size:30px;cursor:pointer;line-height:1;color:var(--line);padding:2px}.rate button.on{color:#F0A81E}
.tip2{display:flex;gap:14px;align-items:flex-start}.tip2 .big{font-size:34px;line-height:1}
.act2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.act2 button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;color:var(--ink);box-shadow:var(--sh)}
.act2 .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--moss)}
.act2 button.pri{background:linear-gradient(150deg,var(--moss),var(--deep));color:#fff;border:0}.act2 button.pri .ic{background:rgba(255,255,255,.18);color:#fff}
.act2 small{font-weight:500;opacity:.75;display:block}
.card.trip{border:2px solid var(--moss)}
.drop{display:flex;align-items:center;gap:12px;margin:0;padding:12px;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;font-weight:600;background:var(--card)}
.drop:focus-within{border-color:var(--moss)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none}
.crow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.crow>.mute{flex:1 1 100%}
.chip2{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--moss)}
.alertb{display:flex;align-items:center;gap:10px;background:#FBE3D3;color:#7A3410;border:1px solid #F1BE9B;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.offline{position:sticky;top:0;z-index:60;background:var(--red);color:#fff;text-align:center;padding:7px;font-size:13px;font-weight:600;border-radius:0 0 12px 12px}
.pitch h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.025em}.pitch p{color:var(--mute);margin:0 0 14px}
.pf{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.pf span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.prof{display:flex;align-items:center;gap:14px}
.sigp{text-align:center;color:var(--mute);font-size:12px;margin:18px 0 6px}.sigp a{color:var(--moss);text-decoration:none;font-weight:600}
.auth{max-width:460px}
.pitch{text-align:center}
.pf{justify-content:center;gap:10px}
.pf span{background:var(--card);box-shadow:var(--sh);padding:8px 14px;font-size:13.5px}
.pf span svg{color:var(--moss)}
.auth>.brand{justify-content:center}

.av.xs{width:28px;height:28px;border-radius:50%;font-size:11px}
.person{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:3px 0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.person span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.ov .card{width:min(360px,100%);margin:0;text-align:center}
.pbig{width:132px;height:132px;border-radius:32px;object-fit:cover;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--moss),var(--deep));color:#fff;font:700 40px 'Sora',sans-serif}
</style>

    <button className="btn sm" style={{background:'var(--red)',color:'#fff'}} disabled={!oldDone.length} onClick={purge}>🗑️ Delete {oldDone.length}</button></div></div></div>

   {pp.pager}</div>}

   {clients.length===0&&<div className="card empty">No clients found.</div>}
   {cp.items.map(u=><ClientRow key={u.id} u={u} reqs={st.reqs.filter(r=>r.uid===u.id)}/>)}

   {tp.items.map(u=>{const mine1=u.id===me;return <div className="note" key={u.id} style={{alignItems:'center',flexWrap:'wrap',opacity:u.blocked?.65:1}}><Av u={u}/><div style={{flex:1,minWidth:150}}><b>{u.name}</b>{mine1&&<span className="pill" style={{marginLeft:6}}>You</span>}{u.blocked&&<span className="pill" style={{marginLeft:6,background:'#FBD9CE',color:'#7A2410'}}>Blocked</span>}<div className="mute">{u.email}{u.phone?' · '+showPhone(u.phone):''}</div>{u.phone&&<Contact phone={u.phone} name={u.name} msg={'Hello '+first(u.name)+', this is RayTECH.'}/>}</div>

    {!mine1&&<button className="btn alt sm" style={u.blocked?{}:{color:'var(--red)'}} onClick={()=>{if(u.blocked||confirm('Block '+u.name+'?\n\nThey will be signed out and cannot use the app until you unblock them.'))act.block(u.id,!u.blocked)}}>{u.blocked?'✅ Unblock':'🚫 Block'}</button>}</div>})}
   {tp.pager}</div>}
  <LearnCorner/>
 </div>
}

const ROLE={client:'Client',worker:'Collector',manager:'Manager'};
const LOGO=<span className="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></span>;
const BRAND=<span>RayTECH Smart App<br/>Garbage Collector</span>;
const fmtNRC=v=>{const d=String(v||'').replace(/\D/g,'').slice(0,9);return d.length>8?d.slice(0,6)+'/'+d.slice(6,8)+'/'+d.slice(8):d.length>6?d.slice(0,6)+'/'+d.slice(6):d};
const NRC_RE=/^\d{6}\/\d{2}\/\d$/;
const errTxt=e=>{const m=((e&&e.message)||'').toLowerCase();
 if(m.includes('nrc'))return 'This NRC is already registered to another account.';
 if(m.includes('invalid login'))return 'Email or password is incorrect.';
 if(m.includes('already registered'))return 'An account with this email already exists. Log in instead.';
 if(m.includes('not confirmed'))return 'Confirm your email first, then log in.';
 if(m.includes('password'))return 'Password must be at least 6 characters.';
 if(m.includes('rate limit')||m.includes('too many'))return 'Too many attempts. Try again later.';
 if(m.includes('fetch')||m.includes('network'))return 'No internet connection.';
 return 'Something went wrong. Try again.'};
const QIDS=new Map();
const qdb=()=>new Promise((res,rej)=>{const o=indexedDB.open('rt_queue',1);o.onupgradeneeded=()=>o.result.createObjectStore('q',{keyPath:'id'});o.onsuccess=()=>res(o.result);o.onerror=()=>rej(o.error)});
const qput=async v=>{const d=await qdb();return new Promise((res,rej)=>{const t=d.transaction('q','readwrite');t.objectStore('q').put(v);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const qall=async()=>{const d=await qdb();return new Promise((res,rej)=>{const q=d.transaction('q').objectStore('q').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const qdel=async id=>{const d=await qdb();return new Promise((res,rej)=>{const t=d.transaction('q','readwrite');t.objectStore('q').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const toReq=r=>{const b={...r,workerId:r.worker_id,proofUrl:r.proof_url,created:+new Date(r.created)},q=QIDS.get(r.id);return q?{...b,status:'collected',kg:q.kg,queued:true}:b};
const toNote=x=>({id:x.id,text:x.text,read:x.is_read,time:new Date(x.created).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})});

function Auth({msg,setMsg}){

  try{localStorage.setItem('rt_remember',rem?'1':'0');if(rem)localStorage.setItem('rt_last_email',em);else localStorage.removeItem('rt_last_email')}catch(e){}
  const {error}=await sb.auth.signInWithPassword({email:em,password:f.pw});if(error)return setMsg(errTxt(error));

function NewPass({msg,setMsg,done}){
 const [a,setA]=useState('');const [b,setB]=useState('');
 const save=async()=>{if(a.length<6)return setMsg('Password must be at least 6 characters.');if(a!==b)return setMsg('Passwords do not match.');
  const {error}=await sb.auth.updateUser({password:a});if(error)return setMsg(errTxt(error));setMsg('Password updated.');done()};
 return <div className="wrap"><div className="auth"><div className="brand" style={{margin:'32px 0 18px'}}>{LOGO}{BRAND}</div>
  <div className="card"><h2>Choose a new password</h2>

function CompleteProfile({user,ui}){
 const [ph,setPh]=useState(user.phone?showPhone(user.phone):''),[nrc,setNrc]=useState(user.nrc||''),[busy,setBusy]=useState(false);
 const needPh=!normPhone(user.phone),needNrc=!NRC_RE.test(user.nrc||'');
 const go=async()=>{if(needPh&&!normPhone(ph))return ui.toast('Enter a valid phone number like 0971234567.');if(needNrc&&!NRC_RE.test(nrc))return ui.toast('Enter your NRC like 123456/10/1.');
  setBusy(true);try{if(needPh)await ui.savePhone(ph);if(needNrc)await ui.saveNrc(nrc)}finally{setBusy(false)}};
 return <div className="wrap"><div className="auth"><div style={{textAlign:'right',paddingTop:8}}><LangBtn/></div>
  <div className="brand" style={{margin:'24px 0 18px'}}>{LOGO}{BRAND}</div>
  <h2>Complete your profile</h2><div className="mute" style={{margin:'6px 0 14px'}}>A phone number (with WhatsApp) and your NRC are required to use RayTECH.</div>
  {needPh&&<div><label htmlFor="cp-ph">Phone number</label><input id="cp-ph" type="tel" inputMode="tel" autoComplete="tel" value={ph} onChange={e=>setPh(e.target.value)} placeholder="0971234567"/></div>}
  {needNrc&&<div><label htmlFor="cp-nrc">NRC number</label><input id="cp-nrc" inputMode="numeric" autoComplete="off" value={nrc} onChange={e=>setNrc(fmtNRC(e.target.value))} placeholder="123456/10/1" maxLength={11}/><div className="mute" style={{marginTop:4}}>Add your NRC once. After saving it cannot be changed.</div></div>}
  <button className="btn full" style={{marginTop:14}} disabled={busy} onClick={go}>Save and continue</button>
  <button type="button" className="link" style={{marginTop:10}} onClick={ui.logout}>Log out</button></div></div>}
function Setup(){return <div className="wrap"><div className="auth"><div className="brand" style={{margin:'32px 0 18px'}}>{LOGO}{BRAND}</div>
 <div className="card"><h2>Connect Supabase</h2><p>Open this file in a text editor, find <b>SUPABASE_URL</b> near the top of the script, and paste your Supabase project URL and public (anon) key. Add your OneSignal App ID too. See README.md.</p></div></div></div>}

function App(){
 const [session,setSession]=useState(undefined);
 const [user,setUser]=useState(undefined);
 const [recovery,setRecovery]=useState(false);
 const [reqs,setReqs]=useState([]);
 const [notes,setNotes]=useState([]);
 const [users,setUsers]=useState([]);
 const [pays,setPays]=useState([]);
 const [msg,setMsg]=useState('');
 const [pushOn,setPushOn]=useState(false);
 const [theme,setTheme]=useTheme(),online=useOnline();
 const [people,setPeople]=useState({});const [sheet,setSheet]=useState(null);
 const link=reqs.map(r=>r.id+':'+(r.worker_id||'')).join(',');
 useEffect(()=>{if(!configured||!user)return;
  if(user.role==='manager'){const m={};users.forEach(u=>{m[u.id]=u});setPeople(m);return}
  let live=true;sb.rpc('my_people').then(({data})=>{if(!live||!data)return;const m={};data.forEach(x=>{m[x.id]=x});setPeople(m);
   sb.rpc('my_contacts').then(({data:c})=>{if(!live||!c)return;setPeople(p=>{const q={...p};c.forEach(x=>{q[x.id]={...(q[x.id]||{id:x.id}),phone:x.phone}});return q})},()=>{})},()=>{});
  return()=>{live=false}},[user&&user.id,user&&user.role,users,link]);
 const st={reqs,notes,pays};
 const merge=row=>setReqs(p=>[toReq(row),...p.filter(x=>x.id!==row.id)].sort((a,b)=>b.created-a.created));
 const uid=session&&session.user.id;
 useEffect(()=>{if(!configured)return;
  sb.auth.getSession().then(({data})=>setSession(data.session));
  const {data:{subscription}}=sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')setRecovery(true);setSession(s)});
  return()=>subscription.unsubscribe()},[]);
 useEffect(()=>{if(!configured||session===undefined)return;
  if(!session){setUser(null);setReqs([]);setNotes([]);setUsers([]);setPays([]);return}
  let off=false;
  (async()=>{for(let i=0;i<5;i++){const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(off)return;if(data){if(data.blocked){setMsg('Your account has been blocked. Contact RayTECH.');sb.auth.signOut();return}let d=data;try{const rq=session.user.user_metadata&&session.user.user_metadata.requested_role;
   if(rq==='worker'&&d.role==='client'&&d.role_claimed===false){const {error:ce}=await sb.rpc('claim_signup_role');if(!ce)d={...d,role:'worker',role_claimed:true}}
   if(window.PENDING_AVATAR){const f=window.PENDING_AVATAR;window.PENDING_AVATAR=null;const path=d.id+'.jpg';const up=await sb.storage.from('avatars').upload(path,await sq(f),{contentType:'image/jpeg',upsert:true});if(!up.error){const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?t='+Date.now();const {error:ae}=await sb.rpc('set_my_avatar',{p_url:url});if(!ae)d={...d,avatar_url:url}}}}catch(e){}
   try{const mp=normPhone(session.user.user_metadata&&session.user.user_metadata.phone);if(mp&&!normPhone(d.phone)){await sb.rpc('set_my_phone',{p_phone:mp});d={...d,phone:mp}}}catch(e){}
   if(off)return;setUser(d);return}await new Promise(r=>setTimeout(r,500))}
   setMsg('Account profile not found. Ask your manager for help.');sb.auth.signOut()})();
  return()=>{off=true}},[uid,session===undefined]);
 useEffect(()=>{if(!configured||!user)return;
  stopAllAlarms();let live=true;const mgr=user.role==='manager';
  sb.from('requests').select('*').order('created',{ascending:false}).then(({data,error})=>{if(!live)return;error?setMsg('Could not load pickups. Check your connection.'):(data.forEach(r=>{if(r.worker_id===user.id&&r.status==='assigned'&&!r.accepted&&!getAccepted().includes(r.id))startAlarm(r.id);if(r.status==='requested'&&(r.offered_to||[]).includes(user.id)&&!getAccepted().includes(r.id))startAlarm(r.id)}),setReqs(data.map(toReq)))});
  const loadUsers=()=>sb.from('profiles').select('*').order('name').then(({data})=>live&&data&&setUsers(data));
  if(mgr){
   sb.from('notifications').select('*').order('created',{ascending:false}).limit(50).then(({data})=>live&&data&&setNotes(data.map(toNote)));
   loadUsers()}
  let ch=sb.channel('rt-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'requests'},p=>{
   if(p.eventType==='DELETE'){stopAlarm(p.old.id);setReqs(prev=>prev.filter(x=>x.id!==p.old.id))}
   else{const n=p.new;
    if((n.worker_id===user.id&&n.status==='assigned'&&!n.accepted)||(n.status==='requested'&&(n.offered_to||[]).includes(user.id))){if(!getAccepted().includes(n.id)&&!PENDING.has(n.id))startAlarm(n.id)}
    else stopAlarm(n.id);
    merge(n)}});
  if(mgr)ch=ch.on('postgres_changes',{event:'*',schema:'public',table:'notifications'},p=>{
   if(p.eventType==='INSERT'&&!MYNOTES.has(p.new.text))chimeOnce();
   if(p.eventType!=='DELETE')setNotes(prev=>[toNote(p.new),...prev.filter(x=>x.id!==p.new.id)].sort((a,b)=>0).slice(0,50))})
   .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},loadUsers);
  ch.subscribe();let pch=null;
  sb.from('payments').select('*').order('created',{ascending:false}).then(({data,error})=>{if(!live||error||!data)return;setPays(data.map(toPay));
   pch=sb.channel('pay-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'payments'},p=>{if(p.eventType!=='DELETE')setPays(prev=>[toPay(p.new),...prev.filter(x=>x.id!==p.new.id)])}).subscribe()});
  return()=>{live=false;stopAllAlarms();sb.removeChannel(ch);pch&&sb.removeChannel(pch)}},[user&&user.id,user&&user.role]);
 useEffect(()=>{if(!configured||!user)return;
  const c=sb.channel('me-'+user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:'id=eq.'+user.id},p=>{const n=p.new;
   if(n.blocked){setMsg('Your account has been blocked. Contact RayTECH.');sb.auth.signOut()}else setUser(u=>({...u,...n}))}).subscribe();
  return()=>{sb.removeChannel(c)}},[user&&user.id]);
 useEffect(()=>{ /* auto-assign: retry unassigned pickups every 30 s while a manager or collector has the app open */
  if(!configured||!user||user.role==='client')return;
  const go=()=>{sb.rpc('retry_unassigned').then(()=>{},()=>{})};go();const t=setInterval(go,30000);return()=>clearInterval(t)},[user&&user.id,user&&user.role]);
 useEffect(()=>{ /* collectors: refresh every 10 s so offers taken by someone else disappear and alarms stop */
  if(!configured||!user||user.role!=='worker')return;
  const t=setInterval(()=>{sb.from('requests').select('*').order('created',{ascending:false}).then(({data})=>{if(!data)return;
   const offered=new Set(data.filter(r=>r.status==='requested'&&(r.offered_to||[]).includes(user.id)).map(r=>r.id));
   [...PENDING].forEach(id=>{const r=data.find(x=>x.id===id);if(!r||(r.status==='requested'&&!offered.has(id))||(r.status!=='requested'&&r.worker_id!==user.id))stopAlarm(id)});
   data.forEach(r=>{if(offered.has(r.id)&&!PENDING.has(r.id)&&!getAccepted().includes(r.id))startAlarm(r.id)});
   setReqs(data.map(toReq))})},10000);return()=>clearInterval(t)},[user&&user.id,user&&user.role]);
 useEffect(()=>{if(!user||!PUSH)return;OneSignalDeferred.push(OS=>{OS.login(user.id);setPushOn(!!OS.Notifications.permission)})},[user&&user.id]);
 useEffect(()=>{document.body.classList.toggle('in',!!user);document.body.classList.toggle('hasnav',!!user&&user.role!=='manager')},[!!user,user&&user.role]);
 useEffect(()=>{if(!msg)return;const t=setTimeout(()=>setMsg(''),3500);return()=>clearTimeout(t)},[msg]);
 const enablePush=()=>OneSignalDeferred.push(async OS=>{await OS.Notifications.requestPermission();const on=!!OS.Notifications.permission;setPushOn(on);setMsg(on?'Alerts turned on for this phone.':'Alerts are blocked. Allow notifications in your browser settings.')});
 const logout=async()=>{if(PUSH)OneSignalDeferred.push(OS=>OS.logout());await sb.auth.signOut()};
 const note=text=>{MYNOTES.add(text);sb.from('notifications').insert({text}).then(()=>{})};
 const fail=()=>setMsg('Something went wrong. Check your connection and try again.');
 const flushing=useRef(false);
 const flushQ=async()=>{if(flushing.current||navigator.onLine===false)return;flushing.current=true;let n=0;
  try{for(const v of await qall()){try{let extra={};
    if(v.photo){const path=v.id+'.jpg';const up=await sb.storage.from('proofs').upload(path,v.photo,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;extra={proof_url:sb.storage.from('proofs').getPublicUrl(path).data.publicUrl+'?t='+Date.now()}}
    const {data,error}=await sb.from('requests').update({status:'collected',kg:Number(v.kg),...extra}).eq('id',v.id).select().single();if(error)throw error;
    await qdel(v.id);QIDS.delete(v.id);merge(data);n++;note(`${v.worker} collected ${v.kg} kg of ${String(v.type).toLowerCase()} waste at ${v.addr}.`)}catch(e){break}}}catch(e){}
  flushing.current=false;if(n)setMsg(n+' saved pickup'+(n>1?'s':'')+' uploaded. Manager notified.')};
 useEffect(()=>{qall().then(a=>{if(a.length){a.forEach(v=>QIDS.set(v.id,v));setReqs(p=>p.map(x=>QIDS.has(x.id)?toReq(x):x))}flushQ()}).catch(()=>{});const f=()=>flushQ();window.addEventListener('online',f);const t=setInterval(f,30000);return()=>{window.removeEventListener('online',f);clearInterval(t)}},[]);
 const act={
  toast:setMsg,
  missed:r=>{note('⚠️ '+r.client+' says the collector did not come for '+r.addr+(r.worker?' (assigned to '+r.worker+')':'')+'.');setMsg('The manager has been told. Thank you for your patience.')},
  rate:(r,n)=>{try{const m=getRated();m[r.id]=n;localStorage.setItem('rated_jobs',JSON.stringify(m))}catch(e){}note(`${r.client} rated ${r.worker} ${n}/5 for the pickup at ${r.addr}.`);setMsg('Thanks for your feedback.')},
  near:(r,m)=>{try{const k='near_w_'+r.id;if(localStorage.getItem(k))return;localStorage.setItem(k,'1')}catch(e){}note(`${r.worker||'Collector'} is about ${m} min from ${r.addr}.`)},
  del:async ids=>{ids=[].concat(ids);let gone=[];
   for(let i=0;i<ids.length;i+=40){const part=ids.slice(i,i+40);
    const {data,error}=await sb.from('requests').delete().in('id',part).select('id');
    if(error)return setMsg('Could not delete. Check your connection and try again.');
    gone=gone.concat((data||[]).map(x=>x.id))}
   if(!gone.length)return setMsg('Nothing was deleted. Run delete-jobs.sql in Supabase once, then try again.');
   gone.forEach(stopAlarm);setReqs(p=>p.filter(x=>!gone.includes(x.id)));
   sb.storage.from('proofs').remove(gone.map(i=>i+'.jpg')).then(()=>{});
   setMsg(gone.length===1?'Pickup deleted.':gone.length+' pickups deleted.')},
  hide:async ids=>{ids=[].concat(ids).map(String);if(!ids.length)return;
   if(!confirm('Delete '+(ids.length===1?'this completed pickup':ids.length+' completed pickups')+' from your list?\n\nOther people\'s records and payment records are kept. Your totals stay the same.'))return;
   const {data,error}=await sb.rpc('hide_jobs',{p_ids:ids});
   if(error)return setMsg('Could not delete. Run hide-jobs.sql in Supabase once, then try again.');
   if(!data)return setMsg('Nothing was deleted. Only completed pickups can be deleted.');
   setReqs(p=>p.map(x=>ids.includes(String(x.id))&&x.status==='collected'?{...x,hidden_by:[...(x.hidden_by||[]),user.id]}:x));
   setMsg(data===1?'Pickup deleted.':data+' pickups deleted.')},
  cancel:async r=>{if(!confirm('Cancel this pickup at '+r.addr+'?'+(r.status==='enroute'?'\n\nThe collector is already on the way.':'')))return;
   const {data,error}=await sb.from('requests').delete().eq('id',r.id).select('id');
   if(error||!data||!data.length)return setMsg('Could not cancel. Run cancel-pickup.sql in Supabase once, then try again.');
   stopAlarm(r.id);setReqs(p=>p.filter(x=>x.id!==r.id));
   note(`${r.client} cancelled the pickup at ${r.addr}${r.worker?' (collector '+r.worker+')':''}.`);setMsg('Pickup cancelled.')},
  claim:async id=>{const {data:ok,error}=await sb.rpc('claim_job',{p_request:String(id)});
   if(error)return fail();
   if(!ok){stopAlarm(id);setReqs(p=>p.filter(x=>x.id!==id));return setMsg('Sorry, another collector accepted this pickup first.')}
   markAccepted(id);stopAlarm(id);const {data:row}=await sb.from('requests').select('*').eq('id',id).maybeSingle();if(row)merge(row);
   setMsg('Job accepted. Manager notified.')},
  skip:async id=>{stopAlarm(id);setReqs(p=>p.filter(x=>x.id!==id));await sb.rpc('decline_job',{p_request:String(id)});setMsg('Skipped. It goes to the next collector.')},
  accepted:id=>{sb.rpc('accept_job',{p_request:String(id)}).then(()=>{})},
  avail:async(on,lat,lng)=>{const {error}=await sb.rpc('set_my_location',{p_lat:lat==null?0:lat,p_lng:lng==null?0:lng,p_available:on});return !error},
  accept:id=>{const r=reqs.find(x=>x.id===id);markAccepted(id);stopAlarm(id);sb.rpc('accept_job',{p_request:String(id)}).then(()=>{});if(r)note(`${r.worker||user.name} accepted the pickup at ${r.addr}.`);setMsg('Job accepted. Manager notified.')},
  add:async f=>{const {data,error}=await sb.from('requests').insert({uid:user.id,client:f.client,addr:f.addr,type:f.type,slot:f.slot,notes:f.notes,lat:f.lat,lng:f.lng}).select().single();
   if(error)return fail();merge(data);note(`New pickup request from ${f.client}: ${f.type} at ${f.addr}.`);setMsg('Pickup requested. We will assign a collector soon.');
   try{await sb.rpc('auto_assign',{p_request:String(data.id)})}catch(e){}},
  autoAssign:async id=>{const {data:ok}=await sb.rpc('auto_assign',{p_request:String(id)});setMsg(ok?'Assigned to the nearest collector.':'No eligible collector nearby right now. It will keep retrying.')},
  assign:async(id,name)=>{const w=users.find(u=>u.role==='worker'&&!u.blocked&&u.name===name);const r=reqs.find(x=>x.id===id);
   const {data,error}=await sb.from('requests').update({worker:w?w.name:null,worker_id:w?w.id:null,status:w?'assigned':'requested'}).eq('id',id).select().single();
   if(error)return fail();merge(data);if(w)note(`${w.name} assigned to ${r.addr}.`)},
  move:async(id,status,kg,photo)=>{const r=reqs.find(x=>x.id===id);
   const queue=async()=>{try{const blob=photo?await shrink(photo):null;const v={id,kg:Number(kg),photo:blob,worker:r.worker,type:r.type,addr:r.addr,ts:Date.now()};await qput(v);QIDS.set(id,v);setReqs(p=>p.map(x=>x.id===id?toReq(x):x));setMsg('No signal. Pickup saved on this phone and will upload automatically.')}catch(e){fail()}};
   if(status==='collected'&&navigator.onLine===false)return queue();
   try{
   let extra={};
   if(photo){const path=id+'.jpg';const up=await sb.storage.from('proofs').upload(path,await shrink(photo),{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;extra={proof_url:sb.storage.from('proofs').getPublicUrl(path).data.publicUrl+'?t='+Date.now()}}
   const {data,error}=await sb.from('requests').update({status,...(kg?{kg:Number(kg)}:{}),...extra}).eq('id',id).select().single();
   if(error)throw error;merge(data);
   note(status==='collected'?`${r.worker} collected ${kg} kg of ${r.type.toLowerCase()} waste at ${r.addr}.`:`${r.worker} is on the way to ${r.addr}.`);
   setMsg(status==='collected'?'Collected. Manager notified.':'Trip started. Client can now track you.')}catch(e){if(status==='collected'&&(navigator.onLine===false||/fetch|network|load failed/i.test(String(e&&e.message))))return queue();fail()}},
  pos:(id,lat,lng)=>{const t=Date.now();if(t-lastPos<4000)return;lastPos=t;sb.from('requests').update({pos:{lat,lng,t}}).eq('id',id).then(()=>{})},

   if(error){const m=(error.message||'')+' '+(error.code||'');setMsg(/PGRST205|42P01|schema cache|does not exist/i.test(m)?'Payments table is missing. Run payments.sql in Supabase, then reload.':'Payment failed: '+(error.message||'unknown error'));return false}
   setPays(p=>[toPay(data),...p.filter(x=>x.id!==data.id)]);note(`${r.client} paid K${data.amount} via ${d.provider} (ID ${d.ref}) for ${r.addr}. Confirm it under Sales.`);setMsg('Payment sent. We will confirm it shortly.');return true},

 };
 if(!configured)return <Setup/>;

   if(file){if(!file.type.startsWith('image/'))return setMsg('Choose an image file.');const path=user.id+'.jpg';const up=await sb.storage.from('avatars').upload(path,await sq(file),{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?t='+Date.now()}

  setUser(u=>({...u,nrc:v}));setMsg('NRC saved and locked to your account.')};
 const savePhone=async v=>{const n=normPhone(v);if(!n)return setMsg('Enter a valid phone number like 0971234567.');
  const {error}=await sb.rpc('set_my_phone',{p_phone:n});
  if(error)return setMsg('Could not save the number. Run phone-contact.sql in Supabase once.');
  setUser(u=>({...u,phone:n}));setMsg('Phone number saved.')};
 const ui={pushOn,enablePush,logout,setAvatar,saveNrc,savePhone,toast:setMsg};
