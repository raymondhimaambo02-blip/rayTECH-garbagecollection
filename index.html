<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RayTECH Smart App Garbage Collector</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF2EE;--card:#fff;--ink:#16241F;--mute:#5E6E67;--line:#D5DDD7;--moss:#2F6B4F;--moss-ink:#fff;--amber:#E8A317;--red:#C4452D;--sky:#2B6E94;--soft:#E1EBE4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1A16;--card:#18271F;--ink:#E8F0EA;--mute:#9AAEA3;--line:#2A3D33;--moss:#5BB88A;--moss-ink:#0F1A16;--soft:#1F3328}}
:root[data-theme=dark]{--bg:#0F1A16;--card:#18271F;--ink:#E8F0EA;--mute:#9AAEA3;--line:#2A3D33;--moss:#5BB88A;--moss-ink:#0F1A16;--soft:#1F3328}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;line-height:1.15}
.logo{width:34px;height:34px;border-radius:10px;background:var(--moss);display:grid;place-items:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:20px}
.seg button{flex:1;border:0;background:none;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer;position:relative}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{position:absolute;top:2px;right:6px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:720px){.grid.two{grid-template-columns:1fr 1fr}.grid.four{grid-template-columns:repeat(4,1fr)}}
.grid.four{grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.grid.four{grid-template-columns:repeat(4,1fr)}}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{border:0;background:var(--moss);color:var(--moss-ink);padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.warn{background:var(--amber);color:#2A1D00}
.btn.full{width:100%;margin-top:16px}
.btn.sm{padding:8px 12px;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft)}
.pill.requested{background:#F7E4B5;color:#5B4100}.pill.assigned{background:#D3E4F0;color:#17435F}
.pill.enroute{background:#FBD9CE;color:#7A2410}.pill.collected{background:#CDEBDA;color:#14472D}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:14px}
.track{display:flex;gap:4px;margin-top:12px}
.track i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track i.d{background:var(--moss)}
.stat b{display:block;font:700 30px 'Bricolage Grotesque',sans-serif}
.note{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.note:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);margin-top:7px;flex:none}
.dot.r{background:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20;max-width:90%}
.empty{text-align:center;padding:28px 10px;color:var(--mute)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.auth{max-width:420px;margin:0 auto}
.link{background:none;border:0;color:var(--moss);font-weight:600;cursor:pointer;padding:8px 0;text-decoration:underline}
.codebox{background:var(--soft);border-radius:10px;padding:12px;margin-top:12px;font-size:14px}
.codebox b{font:700 22px 'Bricolage Grotesque',sans-serif;letter-spacing:2px}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}
.sig{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;font:italic 600 12px/1.2 'Bricolage Grotesque',Figtree,sans-serif;color:var(--mute);opacity:.85;pointer-events:none;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.sig i{font-style:normal;color:var(--moss)}
.sig a{color:var(--moss);text-decoration:none;pointer-events:auto}
.sig{border-radius:14px}
</style>
</head>
<body>
<div id="root"></div>
<div class="sig" aria-label="Created by Raymond Himaambo@innovations"><i>&#9998;</i><span>Created by Raymond Himaambo@innovations<br><a href="tel:+260979566905">&#9742; +260979566905</a></span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
// ===== Paste your keys here (Supabase: Project settings > API. OneSignal: Settings > Keys & IDs) =====
const SUPABASE_URL='https://vxkhkrbsgbualgabacbj.supabase.co';
const SUPABASE_KEY='sb_publishable_XLYKroCRtT-avUHH3-Qjjw__tRa3rCE';
const OS_ID='YOUR_ONESIGNAL_APP_ID';
const configured=!SUPABASE_URL.includes('YOUR_PROJECT_REF');
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let lastPos=0;
window.OneSignalDeferred=window.OneSignalDeferred||[];
if(configured&&!OS_ID.startsWith('YOUR_'))OneSignalDeferred.push(OS=>OS.init({appId:OS_ID}));
const PUSH=!OS_ID.startsWith('YOUR_');
// ===== Assignment alarm: rings + vibrates repeatedly until the collector accepts =====
let AUDIO_CTX=null,ALARM_T=null,WAKE=null;const PENDING=new Set();
const unlockAudio=()=>{try{AUDIO_CTX=AUDIO_CTX||new (window.AudioContext||window.webkitAudioContext)();if(AUDIO_CTX.state==='suspended')AUDIO_CTX.resume()}catch(e){}};
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,unlockAudio,{passive:true}));
const ringOnce=()=>{
 try{if(navigator.vibrate)navigator.vibrate([500,200,500,200,500])}catch(e){}
 try{unlockAudio();if(!AUDIO_CTX)return;const t=AUDIO_CTX.currentTime;
  [[880,0],[1175,0.3],[880,0.6],[1175,0.9]].forEach(([f,d])=>{const o=AUDIO_CTX.createOscillator(),g=AUDIO_CTX.createGain();
   o.type='square';o.frequency.value=f;o.connect(g);g.connect(AUDIO_CTX.destination);
   g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.5,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.27);
   o.start(t+d);o.stop(t+d+0.28)})}catch(e){}};
const getAccepted=()=>{try{return JSON.parse(localStorage.getItem('accepted_jobs')||'[]')}catch(e){return[]}};
const markAccepted=id=>{try{localStorage.setItem('accepted_jobs',JSON.stringify([...new Set([...getAccepted(),id])].slice(-200)))}catch(e){}};
const startAlarm=async id=>{PENDING.add(id);
 if(!ALARM_T){ringOnce();ALARM_T=setInterval(ringOnce,2500)}
 try{if('wakeLock' in navigator&&!WAKE)WAKE=await navigator.wakeLock.request('screen')}catch(e){}};
const stopAlarm=id=>{PENDING.delete(id);
 if(PENDING.size===0){clearInterval(ALARM_T);ALARM_T=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
  try{WAKE&&WAKE.release();WAKE=null}catch(e){}}};
const MYNOTES=new Set();
const chimeOnce=()=>{try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
 try{unlockAudio();if(!AUDIO_CTX)return;const t=AUDIO_CTX.currentTime;
  [[988,0],[1318,0.22]].forEach(([f,d])=>{const o=AUDIO_CTX.createOscillator(),g=AUDIO_CTX.createGain();
   o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AUDIO_CTX.destination);
   g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.5,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.3);
   o.start(t+d);o.stop(t+d+0.32)})}catch(e){}};
const stopAllAlarms=()=>{PENDING.clear();stopAlarm(-1)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&PENDING.size&&'wakeLock' in navigator&&!WAKE)navigator.wakeLock.request('screen').then(w=>WAKE=w).catch(()=>{})});
const STEPS=['requested','assigned','enroute','collected'];
const LABEL={requested:'Requested',assigned:'Assigned',enroute:'On the way',collected:'Collected'};
const TYPES=['Household','Recyclables','Garden waste','Bulky items','Commercial'];
const WORKERS=['Chanda M.','Mwila K.','Bwalya T.'];
const now=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
function Track({s}){const i=STEPS.indexOf(s);return <div className="track" aria-label={LABEL[s]}>{STEPS.map((x,k)=><i key={x} className={k<=i?'d':''}/>)}</div>}

const dist=(a,b,c,d)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmt=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km';
const mapUrl=r=>r.lat!=null?`https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.addr)}`;
function Nav({r}){return <a className="btn alt sm" style={{display:'inline-block',marginTop:12,textDecoration:'none'}} href={mapUrl(r)} target="_blank" rel="noopener">Navigate in Maps</a>}

function Live({r,act}){
 const [acc,setAcc]=useState(null);const [err,setErr]=useState('');
 useEffect(()=>{
  if(!navigator.geolocation){setErr('GPS is not available on this device.');return}
  const w=navigator.geolocation.watchPosition(p=>{setErr('');setAcc(Math.round(p.coords.accuracy));act.pos(r.id,p.coords.latitude,p.coords.longitude)},()=>setErr('Allow location access so the client and manager can track you.'),{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  return()=>navigator.geolocation.clearWatch(w)},[r.id]);
 return <div className="codebox">{err?<span style={{color:'var(--red)'}}>{err}</span>:<span>Sharing live GPS{acc!=null?` (accuracy ${acc} m)`:''}…</span>}<TrackMap r={r}/></div>
}

function TrackMap({r}){
 if(r.status!=='enroute')return null;
 if(!r.pos)return <div className="mute" style={{marginTop:8}}>Waiting for the collector's GPS signal…</div>;
 const p=r.pos,hasD=r.lat!=null;
 const pts=hasD?[p,{lat:r.lat,lng:r.lng}]:[p];
 const la=pts.map(q=>q.lat),lo=pts.map(q=>q.lng);
 const a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo);
 const sx=v=>d===c?150:30+(v-c)/(d-c)*240,sy=v=>b===a?70:120-(v-a)/(b-a)*100;
 const cx=sx(p.lng),cy=sy(p.lat),dx=hasD?sx(r.lng):0,dy=hasD?sy(r.lat):0;
 return <div style={{marginTop:10}}>
  <svg viewBox="0 0 300 140" width="100%" role="img" aria-label="Collector position relative to pickup point"><rect width="300" height="140" rx="10" fill="var(--soft)"/>
   {hasD&&<g><line x1={cx} y1={cy} x2={dx} y2={dy} stroke="var(--mute)" strokeDasharray="5 4"/><circle cx={dx} cy={dy} r="8" fill="var(--amber)"/><text x={dx} y={dy-13} textAnchor="middle" fontSize="11" fill="var(--ink)">Pickup</text></g>}
   <circle cx={cx} cy={cy} r="9" fill="var(--moss)" stroke="var(--card)" strokeWidth="3"/><text x={cx} y={cy+24} textAnchor="middle" fontSize="11" fill="var(--ink)">Collector</text></svg>
  <div className="mute">{hasD?fmt(dist(p.lat,p.lng,r.lat,r.lng))+' away · ':''}updated {new Date(p.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})} · <a href={`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`} target="_blank" rel="noopener" style={{color:'var(--moss)'}}>View on map</a></div></div>
}

const shrink=file=>new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',0.8)};img.onerror=no;img.src=URL.createObjectURL(file)});
function Proof({r}){return r.proofUrl?<a href={r.proofUrl} target="_blank" rel="noopener"><img src={r.proofUrl} alt="Photo proof of collection" style={{width:'100%',maxHeight:220,objectFit:'cover',borderRadius:10,marginTop:10}}/></a>:null}

function Client({st,act,user}){
 const [f,setF]=useState({client:user.name,addr:'',type:TYPES[0],slot:'Today 10:00–12:00',notes:'',lat:null,lng:null});
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const gps=()=>{
  if(!navigator.geolocation)return act.toast('GPS is not available on this device. Type the address instead.');
  act.toast('Finding your location…');
  navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;setF(x=>({...x,lat,lng,addr:x.addr.trim()?x.addr:'GPS location '+lat.toFixed(5)+', '+lng.toFixed(5)}));act.toast('Location pinned.')},()=>act.toast('Could not get your location. Allow location access or type the address.'),{enableHighAccuracy:true,timeout:15000})};
 const submit=()=>{if(!f.client.trim()||!f.addr.trim())return act.toast('Enter your name and pickup address.');act.add({...f,uid:user.id});setF({...f,notes:'',lat:null,lng:null})};
 return <div className="grid two"><div>
  <div className="card"><h2>Request a pickup</h2>
   <label htmlFor="n">Your name</label><input id="n" value={f.client} onChange={set('client')} placeholder="e.g. Grace Phiri"/>
   <label htmlFor="a">Pickup address</label><input id="a" value={f.addr} onChange={set('addr')} placeholder="Type street and area"/>
   <div className="row" style={{marginTop:8,alignItems:'center'}}><button type="button" className="btn alt sm" onClick={gps}>Use my GPS location</button>{f.lat!=null&&<span className="mute">Pinned {f.lat.toFixed(5)}, {f.lng.toFixed(5)} <button className="link" onClick={()=>setF({...f,lat:null,lng:null})}>Clear</button></span>}</div>
   <label htmlFor="t">Waste type</label><select id="t" value={f.type} onChange={set('type')}>{TYPES.map(t=><option key={t}>{t}</option>)}</select>
   <label htmlFor="s">Time slot</label><select id="s" value={f.slot} onChange={set('slot')}>{['Today 10:00–12:00','Today 14:00–16:00','Tomorrow 08:00–10:00','Tomorrow 12:00–14:00'].map(t=><option key={t}>{t}</option>)}</select>
   <label htmlFor="o">Notes for the crew</label><textarea id="o" rows="2" value={f.notes} onChange={set('notes')} placeholder="Where to find the waste"/>
   <button className="btn full" onClick={submit}>Request pickup</button></div></div>
  <div><h2 style={{marginBottom:12}}>Your pickups</h2>
   {!st.reqs.some(r=>r.uid===user.id)&&<div className="card empty">No pickups yet. Request one to get started.</div>}
   {st.reqs.filter(r=>r.uid===user.id).map(r=><div className="card" key={r.id}><div className="row"><div><b>{r.type}</b><div className="mute">{r.addr}</div><div className="mute">{r.slot}</div></div><span className={'pill '+r.status}>{LABEL[r.status]}</span></div>
    <Track s={r.status}/><TrackMap r={r}/><Proof r={r}/>{r.worker&&<div className="mute" style={{marginTop:8}}>Collector: {r.worker}{r.kg?` · ${r.kg} kg collected`:''}</div>}</div>)}
  </div></div>
}

function Worker({st,act,user}){
 const who=user.name;
 const mine=st.reqs.filter(r=>r.worker===who&&r.status!=='collected');
 const done=st.reqs.filter(r=>r.worker===who&&r.status==='collected');
 const [kg,setKg]=useState({});const [ph,setPh]=useState({});const [busy,setBusy]=useState(null);
 return <div>
  <div className="card"><h2>Hello, {who}</h2>
   <div className="mute" style={{marginTop:8}}>{mine.length} to collect · {done.length} done today</div></div>
  {mine.length===0&&<div className="card empty">No jobs assigned. The manager will assign pickups to you.</div>}
  {mine.map(r=><div className="card" key={r.id}><div className="row"><div><h3>{r.addr}</h3><div className="mute">{r.client} · {r.type}</div><div className="mute">{r.slot}</div>{r.notes&&<div style={{marginTop:6}}>“{r.notes}”</div>}</div><span className={'pill '+r.status}>{LABEL[r.status]}</span></div>
   <Track s={r.status}/>
   <Nav r={r}/>{r.status==='enroute'&&<Live r={r} act={act}/>}
   {r.status==='assigned'&&PENDING.has(r.id)&&<button className="btn warn full" onClick={()=>act.accept(r.id)}>Accept job (stop alarm)</button>}
   {r.status==='assigned'&&<button className="btn full" onClick={()=>{markAccepted(r.id);stopAlarm(r.id);act.move(r.id,'enroute')}}>Start trip and share GPS</button>}
   {r.status==='enroute'&&<div><label htmlFor={'k'+r.id}>Weight collected (kg)</label><input id={'k'+r.id} type="number" min="0" inputMode="decimal" value={kg[r.id]||''} onChange={e=>setKg({...kg,[r.id]:e.target.value})} placeholder="e.g. 18"/>
    <label htmlFor={'p'+r.id}>Photo proof</label><input id={'p'+r.id} type="file" accept="image/*" capture="environment" onChange={e=>setPh({...ph,[r.id]:e.target.files[0]})}/>
    {ph[r.id]&&<div className="mute" style={{marginTop:4}}>Photo ready: {ph[r.id].name}</div>}
    <button className="btn warn full" disabled={busy===r.id} onClick={async()=>{if(!kg[r.id])return act.toast('Enter the weight before confirming.');if(!ph[r.id])return act.toast('Take a photo of the collected waste first.');setBusy(r.id);await act.move(r.id,'collected',kg[r.id],ph[r.id]);setBusy(null)}}>{busy===r.id?'Uploading…':'Confirm collected'}</button></div>}
  </div>)}
  {done.length>0&&<div className="card"><h3 style={{marginBottom:6}}>Completed</h3>{done.map(r=><div className="note" key={r.id}><span>{r.addr}</span><span className="mute" style={{marginLeft:'auto'}}>{r.kg} kg</span></div>)}</div>}
 </div>
}

function Manager({st,act,users}){
 const WORKERS=users.filter(u=>u.role==='worker').map(u=>u.name);
 const open=st.reqs.filter(r=>r.status!=='collected').length;
 const col=st.reqs.filter(r=>r.status==='collected');
 const kg=col.reduce((a,r)=>a+Number(r.kg||0),0);
 const unread=st.notes.filter(n=>!n.read).length;
 return <div>
  <div className="grid four">{[['Total',st.reqs.length],['Open',open],['Collected',col.length],['Kg collected',kg]].map(([l,v])=><div className="card stat" key={l}><b>{v}</b><span className="mute">{l}</span></div>)}</div>
  <div className="grid two" style={{alignItems:'start'}}>
   <div className="card"><div className="row" style={{alignItems:'center'}}><h2>Notifications</h2>{unread>0&&<button className="btn alt sm" onClick={act.read}>Mark all read</button>}</div>
    {st.notes.length===0&&<div className="empty">Nothing yet.</div>}
    {st.notes.map(n=><div className="note" key={n.id}><span className={'dot'+(n.read?' r':'')}/><div><div>{n.text}</div><div className="mute">{n.time}</div></div></div>)}</div>
   <div className="card"><h2 style={{marginBottom:8}}>Assign pickups</h2>
    {st.reqs.filter(r=>r.status==='requested'||r.status==='assigned').map(r=><div className="note" key={r.id} style={{flexWrap:'wrap'}}>
     <div style={{flex:1,minWidth:150}}><b>{r.addr}</b><div className="mute">{r.type} · {r.slot}</div></div>
     <select aria-label="Assign collector" style={{width:140}} value={r.worker||''} onChange={e=>act.assign(r.id,e.target.value)}><option value="">Unassigned</option>{WORKERS.map(w=><option key={w}>{w}</option>)}</select></div>)}
    {open===0&&<div className="empty">All pickups are collected.</div>}</div>
  </div>
  {st.reqs.some(r=>r.status==='enroute')&&<div className="card"><h2 style={{marginBottom:8}}>Live tracking</h2>{st.reqs.filter(r=>r.status==='enroute').map(r=><div key={r.id} style={{marginBottom:14}}><b>{r.worker}</b> heading to {r.addr}<TrackMap r={r}/></div>)}</div>}
  <div className="card"><h2 style={{marginBottom:4}}>Team</h2><div className="mute" style={{marginBottom:6}}>People who register start as clients. Promote them to Collector or Manager here.</div>{users.map(u=><div className="note" key={u.id} style={{alignItems:'center'}}><div style={{flex:1}}><b>{u.name}</b><div className="mute">{u.email}</div></div><select aria-label={'Role for '+u.name} style={{width:130}} value={u.role} onChange={e=>act.setRole(u.id,e.target.value)}>{Object.entries(ROLE).map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></div>)}</div>
  <div className="card scroll"><h2 style={{marginBottom:8}}>All pickups</h2><table><thead><tr><th>Client</th><th>Address</th><th>Type</th><th>Collector</th><th>Status</th><th>Kg</th><th>Proof</th></tr></thead>
   <tbody>{st.reqs.map(r=><tr key={r.id}><td>{r.client}</td><td>{r.addr}</td><td>{r.type}</td><td>{r.worker||'—'}</td><td><span className={'pill '+r.status}>{LABEL[r.status]}</span></td><td>{r.kg||'—'}</td><td>{r.proofUrl?<a href={r.proofUrl} target="_blank" rel="noopener" style={{color:'var(--moss)'}}>View photo</a>:'—'}</td></tr>)}</tbody></table></div>
 </div>
}

const LOGO=<span className="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></span>;
const BRAND=<span>RayTECH Smart App<br/>Garbage Collector</span>;
const errTxt=e=>{const m=((e&&e.message)||'').toLowerCase();
 if(m.includes('invalid login'))return 'Email or password is incorrect.';
 if(m.includes('already registered'))return 'An account with this email already exists. Log in instead.';
 if(m.includes('not confirmed'))return 'Confirm your email first, then log in.';
 if(m.includes('password'))return 'Password must be at least 6 characters.';
 if(m.includes('rate limit')||m.includes('too many'))return 'Too many attempts. Try again later.';
 if(m.includes('fetch')||m.includes('network'))return 'No internet connection.';
 return 'Something went wrong. Try again.'};
const toReq=r=>({...r,workerId:r.worker_id,proofUrl:r.proof_url,created:+new Date(r.created)});
const toNote=x=>({id:x.id,text:x.text,read:x.is_read,time:new Date(x.created).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})});

function NewPass({msg,setMsg,done}){
 const [a,setA]=useState('');const [b,setB]=useState('');
 const save=async()=>{if(a.length<6)return setMsg('Password must be at least 6 characters.');if(a!==b)return setMsg('Passwords do not match.');
  const {error}=await sb.auth.updateUser({password:a});if(error)return setMsg(errTxt(error));setMsg('Password updated.');done()};
 return <div className="wrap"><div className="auth"><div className="brand" style={{margin:'32px 0 18px'}}>{LOGO}{BRAND}</div>
  <div className="card"><h2>Choose a new password</h2>
   <label htmlFor="a1">New password</label><input id="a1" type="password" value={a} onChange={e=>setA(e.target.value)} autoComplete="new-password"/>
   <label htmlFor="a2">Confirm new password</label><input id="a2" type="password" value={b} onChange={e=>setB(e.target.value)} autoComplete="new-password"/>
   <button className="btn full" onClick={save}>Save password</button></div></div>{msg&&<div className="toast" role="status">{msg}</div>}</div>
}

function Setup(){return <div className="wrap"><div className="auth"><div className="brand" style={{margin:'32px 0 18px'}}>{LOGO}{BRAND}</div>
 <div className="card"><h2>Connect Supabase</h2><p>Open this file in a text editor, find <b>SUPABASE_URL</b> near the top of the script, and paste your Supabase project URL and public (anon) key. Add your OneSignal App ID too. See README.md.</p></div></div></div>}

function App(){
 const [session,setSession]=useState(undefined);
 const [user,setUser]=useState(undefined);
 const [recovery,setRecovery]=useState(false);
 const [reqs,setReqs]=useState([]);
 const [notes,setNotes]=useState([]);
 const [users,setUsers]=useState([]);
 const [msg,setMsg]=useState('');
 const [pushOn,setPushOn]=useState(false);
 const st={reqs,notes};
 const merge=row=>setReqs(p=>[toReq(row),...p.filter(x=>x.id!==row.id)].sort((a,b)=>b.created-a.created));
 const uid=session&&session.user.id;
 useEffect(()=>{if(!configured)return;
  sb.auth.getSession().then(({data})=>setSession(data.session));
  const {data:{subscription}}=sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')setRecovery(true);setSession(s)});
  return()=>subscription.unsubscribe()},[]);
 useEffect(()=>{if(!configured||session===undefined)return;
  if(!session){setUser(null);setReqs([]);setNotes([]);setUsers([]);return}
  let off=false;
  (async()=>{for(let i=0;i<5;i++){const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(off)return;if(data){setUser(data);return}await new Promise(r=>setTimeout(r,500))}
   setMsg('Account profile not found. Ask your manager for help.');sb.auth.signOut()})();
  return()=>{off=true}},[uid,session===undefined]);
 useEffect(()=>{if(!configured||!user)return;
  stopAllAlarms();let live=true;const mgr=user.role==='manager';
  sb.from('requests').select('*').order('created',{ascending:false}).then(({data,error})=>{if(!live)return;error?setMsg('Could not load pickups. Check your connection.'):(data.forEach(r=>{if(r.worker_id===user.id&&r.status==='assigned'&&!getAccepted().includes(r.id))startAlarm(r.id)}),setReqs(data.map(toReq)))});
  const loadUsers=()=>sb.from('profiles').select('*').order('name').then(({data})=>live&&data&&setUsers(data));
  if(mgr){
   sb.from('notifications').select('*').order('created',{ascending:false}).limit(50).then(({data})=>live&&data&&setNotes(data.map(toNote)));
   loadUsers()}
  let ch=sb.channel('rt-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'requests'},p=>{
   if(p.eventType==='DELETE'){stopAlarm(p.old.id);setReqs(prev=>prev.filter(x=>x.id!==p.old.id))}
   else{const n=p.new;
    if(n.worker_id===user.id&&n.status==='assigned'){if(!getAccepted().includes(n.id)&&!PENDING.has(n.id))startAlarm(n.id)}
    else stopAlarm(n.id);
    merge(n)}});
  if(mgr)ch=ch.on('postgres_changes',{event:'*',schema:'public',table:'notifications'},p=>{
   if(p.eventType==='INSERT'&&!MYNOTES.has(p.new.text))chimeOnce();
   if(p.eventType!=='DELETE')setNotes(prev=>[toNote(p.new),...prev.filter(x=>x.id!==p.new.id)].sort((a,b)=>0).slice(0,50))})
   .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},loadUsers);
  ch.subscribe();
  return()=>{live=false;stopAllAlarms();sb.removeChannel(ch)}},[user&&user.id,user&&user.role]);
 useEffect(()=>{if(!user||!PUSH)return;OneSignalDeferred.push(OS=>{OS.login(user.id);setPushOn(!!OS.Notifications.permission)})},[user&&user.id]);
 useEffect(()=>{if(!msg)return;const t=setTimeout(()=>setMsg(''),3500);return()=>clearTimeout(t)},[msg]);
 const enablePush=()=>OneSignalDeferred.push(async OS=>{await OS.Notifications.requestPermission();const on=!!OS.Notifications.permission;setPushOn(on);setMsg(on?'Alerts turned on for this phone.':'Alerts are blocked. Allow notifications in your browser settings.')});
 const logout=async()=>{if(PUSH)OneSignalDeferred.push(OS=>OS.logout());await sb.auth.signOut()};
 const note=text=>{MYNOTES.add(text);sb.from('notifications').insert({text}).then(()=>{})};
 const fail=()=>setMsg('Something went wrong. Check your connection and try again.');
 const act={
  toast:setMsg,
  add:async f=>{const {data,error}=await sb.from('requests').insert({uid:user.id,client:f.client,addr:f.addr,type:f.type,slot:f.slot,notes:f.notes,lat:f.lat,lng:f.lng}).select().single();
   if(error)return fail();merge(data);note(`New pickup request from ${f.client}: ${f.type} at ${f.addr}.`);setMsg('Pickup requested. We will assign a collector soon.')},
  assign:async(id,name)=>{const w=users.find(u=>u.role==='worker'&&u.name===name);const r=reqs.find(x=>x.id===id);
   const {data,error}=await sb.from('requests').update({worker:w?w.name:null,worker_id:w?w.id:null,status:w?'assigned':'requested'}).eq('id',id).select().single();
   if(error)return fail();merge(data);if(w)note(`${w.name} assigned to ${r.addr}.`)},
  accept:id=>{const r=reqs.find(x=>x.id===id);markAccepted(id);stopAlarm(id);if(r)note(`${r.worker||user.name} accepted the pickup at ${r.addr}.`);setMsg('Job accepted. Manager notified.')},
  move:async(id,status,kg,photo)=>{const r=reqs.find(x=>x.id===id);try{
   let extra={};
   if(photo){const path=id+'.jpg';const up=await sb.storage.from('proofs').upload(path,await shrink(photo),{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;extra={proof_url:sb.storage.from('proofs').getPublicUrl(path).data.publicUrl+'?t='+Date.now()}}
   const {data,error}=await sb.from('requests').update({status,...(kg?{kg:Number(kg)}:{}),...extra}).eq('id',id).select().single();
   if(error)throw error;merge(data);
   note(status==='collected'?`${r.worker} collected ${kg} kg of ${r.type.toLowerCase()} waste at ${r.addr}.`:`${r.worker} is on the way to ${r.addr}.`);
   setMsg(status==='collected'?'Collected. Manager notified.':'Trip started. Client can now track you.')}catch(e){fail()}},
  pos:(id,lat,lng)=>{const t=Date.now();if(t-lastPos<4000)return;lastPos=t;sb.from('requests').update({pos:{lat,lng,t}}).eq('id',id).then(()=>{})},
  read:()=>{setNotes(n=>n.map(x=>({...x,read:true})));sb.from('notifications').update({is_read:true}).eq('is_read',false).then(()=>{})},
  setRole:(id,role)=>sb.from('profiles').update({role}).eq('id',id).then(({error})=>error?fail():setMsg('Role updated.'))
 };
 if(!configured)return <Setup/>;
 if(recovery&&session)return <NewPass msg={msg} setMsg={setMsg} done={()=>setRecovery(false)}/>;
 if(session===undefined||(session&&user===undefined))return <div className="wrap"><div className="empty">Loading…</div></div>;
 if(!session||!user)return <Auth msg={msg} setMsg={setMsg}/>;
 const unread=notes.filter(n=>!n.read).length;
 return <div className="wrap">
  <header><div className="brand">{LOGO}{BRAND}</div>
   <div style={{textAlign:'right'}}><div className="mute">{user.name} · {ROLE[user.role]}</div><button className="btn alt sm" onClick={logout}>Log out</button></div></header>
  {PUSH&&!pushOn&&<div className="card row" style={{alignItems:'center'}}><span>Get alerts on this phone, even when the app is closed.</span><button className="btn sm" onClick={enablePush}>Turn on alerts</button></div>}
  {user.role==='manager'&&unread>0&&<div className="card" role="status"><b>{unread} new notification{unread>1?'s':''}</b></div>}
  {user.role==='client'&&<Client st={st} act={act} user={user}/>}
  {user.role==='worker'&&<Worker st={st} act={act} user={user}/>}
  {user.role==='manager'&&<Manager st={st} act={act} users={users}/>}
  {msg&&<div className="toast" role="status">{msg}</div>}
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
