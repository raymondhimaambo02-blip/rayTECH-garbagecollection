<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RayTECH Smart App Garbage Collector</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F6B4F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF2EE;--card:#fff;--ink:#16241F;--mute:#5E6E67;--line:#D5DDD7;--moss:#2F6B4F;--moss-ink:#fff;--amber:#E8A317;--red:#C4452D;--sky:#2B6E94;--soft:#E1EBE4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1A16;--card:#18271F;--ink:#E8F0EA;--mute:#9AAEA3;--line:#2A3D33;--moss:#5BB88A;--moss-ink:#0F1A16;--soft:#1F3328}}
:root[data-theme=dark]{--bg:#0F1A16;--card:#18271F;--ink:#E8F0EA;--mute:#9AAEA3;--line:#2A3D33;--moss:#5BB88A;--moss-ink:#0F1A16;--soft:#1F3328}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;line-height:1.15}
.logo{width:34px;height:34px;border-radius:10px;background:var(--moss);display:grid;place-items:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:20px}
.seg button{flex:1;border:0;background:none;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer;position:relative}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{position:absolute;top:2px;right:6px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:720px){.grid.two{grid-template-columns:1fr 1fr}.grid.four{grid-template-columns:repeat(4,1fr)}}
.grid.four{grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.grid.four{grid-template-columns:repeat(4,1fr)}}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{border:0;background:var(--moss);color:var(--moss-ink);padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.warn{background:var(--amber);color:#2A1D00}
.btn.full{width:100%;margin-top:16px}
.btn.sm{padding:8px 12px;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft)}
.pill.requested{background:#F7E4B5;color:#5B4100}.pill.assigned{background:#D3E4F0;color:#17435F}
.pill.enroute{background:#FBD9CE;color:#7A2410}.pill.collected{background:#CDEBDA;color:#14472D}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:14px}
.track{display:flex;gap:4px;margin-top:12px}
.track i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track i.d{background:var(--moss)}
.stat b{display:block;font:700 30px 'Bricolage Grotesque',sans-serif}
.note{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.note:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);margin-top:7px;flex:none}
.dot.r{background:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20;max-width:90%}
.empty{text-align:center;padding:28px 10px;color:var(--mute)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.auth{max-width:420px;margin:0 auto}
.link{background:none;border:0;color:var(--moss);font-weight:600;cursor:pointer;padding:8px 0;text-decoration:underline}
.codebox{background:var(--soft);border-radius:10px;padding:12px;margin-top:12px;font-size:14px}
.codebox b{font:700 22px 'Bricolage Grotesque',sans-serif;letter-spacing:2px}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}
.ttk summary{cursor:pointer;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;font-size:18px}
.ttk ul{margin:12px 0 0;padding-left:18px}
.ttk li{margin-bottom:8px;font-size:14px}
.fade{animation:fd .3s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px -8px rgba(0,0,0,.12)}
.hero{background:linear-gradient(135deg,var(--moss),#1d4d38);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hero .hi{font:700 24px 'Bricolage Grotesque',sans-serif}.hero .sub{opacity:.85;font-size:14px}
.hstats{display:flex;gap:10px}.hstats div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 14px;text-align:center}
.hstats b{display:block;font:700 20px 'Bricolage Grotesque',sans-serif}.hstats span{font-size:12px;opacity:.85}
.live{display:block;width:100%;text-align:left;cursor:pointer;background:#FBD9CE;color:#7A2410;border-color:#F3B9A6}.live u{margin-left:6px;font-weight:600}
.seg button{transition:.15s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip b{margin-left:6px;font-size:12px;background:var(--soft);border-radius:99px;padding:1px 7px}.chip.on{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}.chip.on b{background:rgba(255,255,255,.25)}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}.srch input{border:0;background:none;padding:11px 0;outline:0}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.tile{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.tile span{font-size:24px}.tile.on{border-color:var(--moss);background:var(--soft)}
.steps{display:flex;margin-top:12px}.sp{flex:1;text-align:center;position:relative;font-size:11px;color:var(--mute)}
.sp:not(:first-child):before{content:'';position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--line)}.sp.d:not(:first-child):before{background:var(--moss)}
.sp i{position:relative;z-index:1;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);margin:0 auto 4px;font-style:normal;font-weight:700;font-size:12px;color:var(--ink)}
.sp.d i{background:var(--moss);color:var(--moss-ink)}.sp.now i{box-shadow:0 0 0 4px var(--soft)}.sp.now{color:var(--ink);font-weight:600}
.pc{padding:14px}.pc-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:0}
.grow{flex:1;min-width:0}.chev{color:var(--mute);font-size:11px}.pc-b{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:grid;gap:6px}
.ico,.av{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}.av{border-radius:50%;font:700 15px 'Bricolage Grotesque',sans-serif;color:var(--moss);font-size:15px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}.pg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sz{width:auto;padding:8px 10px;font-size:14px}.btn:disabled{opacity:.45;cursor:default}
.stat.tap{text-align:left;cursor:pointer;color:var(--ink);transition:transform .15s}.stat.tap:hover{transform:translateY(-2px)}.si{font-size:22px;display:block}
.bar{display:grid;grid-template-columns:130px 1fr 28px;gap:8px;align-items:center;font-size:14px;margin-bottom:8px}.bar div{background:var(--soft);border-radius:99px;height:10px}.bar i{display:block;height:10px;border-radius:99px;background:var(--moss)}.bar b{text-align:right}
.btn{transition:transform .1s}.btn:active{transform:scale(.97)}
.bgshow{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bgshow i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:bgf 18s infinite}
.bgshow i:nth-child(2){animation-delay:9s}
.bgshow:after{content:'';position:absolute;inset:0;background:var(--bg);opacity:.6}
@keyframes bgf{0%{opacity:0;transform:scale(1)}8%{opacity:1}50%{opacity:1}58%{opacity:0}100%{opacity:0;transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){.bgshow i{animation:none}.bgshow i:first-child{opacity:1}}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card.live{background:#FBD9CE}
header,.auth>.brand{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:12px}
.auth>.brand{margin:32px 0 18px}
.seg{overflow-x:auto}.seg button{white-space:nowrap;font-size:14px;padding:10px 12px}
.tile small{font-weight:500;color:var(--mute)}
.paid{margin-top:12px;padding:10px 12px;border-radius:10px;background:#CDEBDA;color:#14472D;font-weight:600;font-size:14px}
.paid.wait{background:#F7E4B5;color:#5B4100}.paid.bad{background:#FBD9CE;color:#7A2410}
.pn{min-width:38px;padding:8px 0}.btn.alt.on{background:var(--moss);color:var(--moss-ink)}
.sig{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;font:italic 600 12px/1.2 'Bricolage Grotesque',Figtree,sans-serif;color:var(--mute);opacity:.85;pointer-events:none;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.sig i{font-style:normal;color:var(--moss)}
.sig a{color:var(--moss);text-decoration:none;pointer-events:auto}
.sig{border-radius:14px}
.lc h2{font-size:20px}
.tipbig{background:var(--soft);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start;animation:fd .3s ease}
.tipbig .big{font-size:40px;line-height:1}
.qopt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;font-weight:600}
.qopt.ok{border-color:var(--moss);background:#CDEBDA;color:#14472D}.qopt.no{border-color:var(--red);background:#FBD9CE;color:#7A2410}
.lc-prog{height:8px;background:var(--soft);border-radius:99px}.lc-prog i{display:block;height:8px;border-radius:99px;background:var(--moss);transition:width .3s}
.badge-big{text-align:center;padding:12px}.badge-big span{font-size:60px;display:block}
.pulse{fill:var(--moss);transform-box:fill-box;transform-origin:center;animation:pl 1.6s ease-out infinite}
@keyframes pl{from{transform:scale(1);opacity:.55}to{transform:scale(2.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
.eta{display:inline-block;background:var(--soft);border-radius:99px;padding:3px 10px;font-weight:600;color:var(--ink);margin-right:6px}
.arr{margin-top:10px;padding:10px 12px;border-radius:10px;background:#CDEBDA;color:#14472D;font-weight:600;animation:fd .3s ease}
.stars{display:flex;gap:4px;margin-top:12px;align-items:center;flex-wrap:wrap}.stars button{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--line);padding:0 2px;transition:transform .1s}.stars button.on{color:var(--amber)}.stars button:hover{transform:scale(1.2)}
.lmap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.lmap>div:first-child{height:260px;z-index:0}
.navcard{background:var(--moss);color:var(--moss-ink);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:14px;align-items:center}
.navcard .ar{font-size:44px;line-height:1;width:56px;text-align:center;flex:none}
.navcard .nd{font:700 22px 'Bricolage Grotesque',sans-serif;line-height:1.1}.navcard .nt{font-weight:600;line-height:1.25;margin-top:2px}
.navbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.navbar .mute{flex:1;min-width:120px}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px}.steps li{margin-bottom:6px}.steps li.now{font-weight:700;color:var(--moss)}
.recen{position:absolute;right:10px;bottom:22px;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.mk{position:relative;width:40px;height:40px;border-radius:50%;background:var(--card);border:3px solid var(--moss);display:grid;place-items:center;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.3)}.mk.home{border-color:var(--amber)}
.mk.car:after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--moss);animation:pl 1.6s ease-out infinite}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lmap .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
:root[data-theme=dark] .lmap .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
body.night .navcard{background:#0A1511;color:#9FE3BD}body.night .lmap .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.navbar select,.navbar input[type=range]{width:auto}
</style>


</head>

  case 'depart':return 'Head '+COMPASS[Math.round(((m.bearing_after||0)%360)/45)%8]+(st.name?' on '+st.name:'');
  case 'arrive':return 'You have arrived at the pickup point'+(mod&&mod!=='straight'?', on your '+(mod.includes('left')?'left':'right'):'');
  case 'roundabout':case 'rotary':case 'roundabout turn':return m.exit?('At the roundabout take exit '+m.exit+nm):('Enter the roundabout'+nm);
  case 'exit roundabout':case 'exit rotary':return 'Exit the roundabout'+nm;
  case 'fork':return 'Keep '+(mod&&mod.includes('left')?'left':'right')+' at the fork'+nm;
  case 'merge':return 'Merge'+(mod&&mod!=='straight'?' '+mod:'')+nm;
  case 'on ramp':case 'off ramp':return 'Take the ramp'+nm;
  case 'end of road':return 'At the end of the road turn '+(mod||'')+nm;
  case 'continue':case 'new name':return (mod&&mod!=='straight'?('Bear '+mod):'Continue straight')+nm;
  default:
   if(m.modifier==='uturn')return 'Make a U-turn';
   if(!mod||mod==='straight')return 'Continue straight'+nm;
   return 'Turn '+mod+nm}

}

const shrink=file=>new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',0.8)};img.onerror=no;img.src=URL.createObjectURL(file)});
function Proof({r}){return r.proofUrl?<a href={r.proofUrl} target="_blank" rel="noopener"><img src={r.proofUrl} alt="Photo proof of collection" style={{width:'100%',maxHeight:220,objectFit:'cover',borderRadius:10,marginTop:10}}/></a>:null}

const shareTrack=r=>{const p=r.pos,m=r.lat!=null?Math.max(1,Math.round(dist(p.lat,p.lng,r.lat,r.lng)/417)):null;
 const t='🚛 '+(r.worker||'The collector')+' is on the way to '+r.addr+'.'+(m?' About '+m+' min away.':'')+' Collector location now: https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng;
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')};
function Thumb({f,clear}){const u=React.useMemo(()=>f?URL.createObjectURL(f):null,[f]);useEffect(()=>()=>{u&&URL.revokeObjectURL(u)},[u]);
 return u?<div style={{marginTop:8}}><img src={u} alt="Preview of the proof photo" style={{width:'100%',maxHeight:200,objectFit:'cover',borderRadius:10}}/><button type="button" className="link" onClick={clear}>Retake photo</button></div>:null}
const getRate=id=>{try{return +(localStorage.getItem('rate_'+id)||0)}catch(e){return 0}};

function Resched({r,act}){const [o,setO]=useState(false),[d,setD]=useState(''),[t,setT]=useState('');

  <div className="grid two" style={{gap:8}}><input type="date" aria-label="New date" min={new Date().toLocaleDateString('en-CA')} value={d} onChange={e=>setD(e.target.value)}/><input type="time" aria-label="New time" value={t} onChange={e=>setT(e.target.value)}/></div>
  <button className="btn sm" style={{marginTop:8}} onClick={()=>{if(!d||!t)return act.toast('Choose both a date and a time.');const dt=new Date(d+'T'+t);if(dt<new Date())return act.toast('Choose a time in the future.');save(dt.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})+' at '+dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}}>Save new time</button> <button className="link" onClick={()=>setO(false)}>Close</button></div>}
function Stars({id,act,v0}){const [v,setV]=useState(v0||getRate(id));return <div className="stars"><span className="mute">{v?'Thanks for rating!':'Rate this pickup'}</span>{[1,2,3,4,5].map(n=><button key={n} aria-label={n+' stars'} className={n<=v?'on':''} onClick={()=>{setV(n);try{localStorage.setItem('rate_'+id,n)}catch(e){}act.rate(id,n);act.toast(n>=4?'Glad we could help! ⭐':'Thanks. We will do better.')}}>★</button>)}</div>}
const T=r=>r.created||0;

function Search({v,set,ph}){return <div className="srch"><span aria-hidden="true">🔍</span><input aria-label={ph} value={v} onChange={e=>set(e.target.value)} placeholder={ph}/>{v&&<button className="x" aria-label="Clear search" onClick={()=>set('')}>×</button>}</div>}
function Pager({n,p,pages,size,setPage,setSize,label}){
 if(n<=Math.min(size,5))return null;
 const a=p*size+1,b=Math.min(n,(p+1)*size),nx=Math.min(size,n-b);
 const nums=[];for(let i=Math.max(0,p-1);i<=Math.min(pages-1,p+1);i++)nums.push(i);
 return <div className="pager"><div className="mute">Showing {a}–{b} of {n} {label}</div>
  <div className="pg"><button className="btn alt sm" disabled={p===0} onClick={()=>setPage(p-1)}>← Prev</button>
  {nums[0]>0&&<span className="mute">…</span>}{nums.map(i=><button key={i} className={'btn alt sm pn'+(i===p?' on':'')} aria-label={'Page '+(i+1)} aria-current={i===p?'page':undefined} onClick={()=>setPage(i)}>{i+1}</button>)}{nums[nums.length-1]<pages-1&&<span className="mute">…</span>}
  <button className="btn sm" disabled={p>=pages-1} onClick={()=>setPage(p+1)}>Next {nx||''} →</button>
  <select aria-label="Per page" className="sz" value={size} onChange={e=>{setSize(+e.target.value);setPage(0)}}>{[...new Set([5,10,20,50,size])].sort((x,y)=>x-y).map(x=><option key={x} value={x}>{x}/page</option>)}</select></div></div>}
function usePaged(list,init,label){
 const [page,setPage]=useState(0),[size,setSize]=useState(init);
 const pages=Math.max(1,Math.ceil(list.length/size)),p=Math.min(page,pages-1);

 return {items:list.slice(p*size,p*size+size),reset:()=>setPage(0),pager:<Pager n={list.length} p={p} pages={pages} size={size} setPage={go} setSize={setSize} label={label}/>}}

 const geoSearch=async qq=>{const n=await getJ(NOM+'search?format=jsonv2&limit=6&countrycodes=zm&accept-language=en&q='+encodeURIComponent(qq));if(n&&n.length)return n;

 useEffect(()=>{if(!window.L||!el.current)return;const L=window.L,map=L.map(el.current).setView([-15.4167,28.2833],12);

function Replay({r}){const [pts,setPts]=useState(null),el=React.useRef(null);
 useEffect(()=>{if(!pts||!pts.length||!window.L||!el.current)return;const L=window.L,map=L.map(el.current),ll=pts.map(p=>[p.lat,p.lng]);

  const pl=L.polyline(ll,{color:'#2B6E94',weight:4,opacity:.4}).addTo(map);map.fitBounds(pl.getBounds(),{padding:[30,30]});if(r.lat!=null)L.marker([r.lat,r.lng]).addTo(map).bindTooltip('Pickup');
  const mk=L.circleMarker(ll[0],{radius:8,color:'#2F6B4F',fillOpacity:1}).addTo(map),dn=L.polyline([ll[0]],{color:'#2F6B4F',weight:5}).addTo(map);let i=0;
  const t=setInterval(()=>{i++;if(i>=ll.length){clearInterval(t);return}mk.setLatLng(ll[i]);dn.addLatLng(ll[i])},Math.max(60,Math.min(400,12000/ll.length)));
  setTimeout(()=>map.invalidateSize(),200);return()=>{clearInterval(t);map.remove()}},[pts]);
 const load=async()=>{const {data,error}=await sb.from('trip_points').select('lat,lng,created').eq('request_id',String(r.id)).order('created');setPts(error?[]:data||[])};
 if(!pts)return <button type="button" className="btn alt sm" style={{marginTop:12,marginRight:8}} onClick={load}>▶ Replay trip</button>;
 if(!pts.length)return <div className="mute">No driven path was recorded for this pickup. (Run navigation-features.sql in Supabase once.)</div>;
 let km=0;for(let i=1;i<pts.length;i++){const d=dist(pts[i-1].lat,pts[i-1].lng,pts[i].lat,pts[i].lng);if(d<2000)km+=d}
 return <div style={{marginTop:10}}><div className="lmap"><div ref={el}/></div><div className="mute">{fmt(km)} driven · {Math.max(1,Math.round((new Date(pts[pts.length-1].created)-new Date(pts[0].created))/60000))} min · started {new Date(pts[0].created).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>}

function Delays({reqs,workers,act}){

 let seen={};try{seen=JSON.parse(localStorage.getItem('assigned_seen')||'{}')}catch(e){}
 let ch=false;const kf=r=>r.id+'|'+r.worker;reqs.filter(r=>r.status==='assigned').forEach(r=>{if(!seen[kf(r)]){seen[kf(r)]=Date.now();ch=true}});if(ch)try{localStorage.setItem('assigned_seen',JSON.stringify(seen))}catch(e){}
 const mn=x=>Math.round((Date.now()-x)/60000);
 const late=reqs.map(r=>{if(r.status==='assigned'){const t0=r.assigned_at?+new Date(r.assigned_at):seen[kf(r)],a=t0?mn(t0):0;return a>=lim?{r,why:'Assigned '+a+' min ago, trip not started'}:null}
  if(r.status==='enroute'){const a=r.pos?mn(r.pos.t):lim;return a>=lim?{r,why:r.pos?'No GPS update for '+a+' min':'Trip started but no GPS signal'}:null}return null}).filter(Boolean);
 const open=w=>reqs.filter(r=>r.worker===w&&r.status!=='collected').length;
 const best=r=>workers.filter(w=>w!==r.worker).sort((a,b)=>open(a)-open(b))[0];

  {late.length===0&&<div className="mute" style={{marginTop:8}}>✅ Nobody is running late.</div>}
  {late.map(({r,why})=><div className="note" key={r.id} style={{flexWrap:'wrap',alignItems:'center'}}><span>{ICON[r.type]}</span><div style={{flex:1,minWidth:170}}><b>{r.addr}</b><div className="mute">{r.worker} · {why}</div></div>
   <select aria-label="Reassign to" style={{width:150}} value="" onChange={e=>e.target.value&&ask('Reassign '+r.addr+' to '+e.target.value+'?',()=>act.assign(r.id,e.target.value))}><option value="">Reassign to…</option>{workers.filter(w=>w!==r.worker).map(w=><option key={w} value={w}>{w} ({open(w)} open)</option>)}</select>
   {best(r)&&<button className="btn sm" onClick={()=>ask('Reassign to '+best(r)+' (least busy)?',()=>act.assign(r.id,best(r)))}>⚡ Least busy</button>}
   <button className="btn alt sm" onClick={()=>ask('Send this pickup back to nearby collectors?',()=>act.assign(r.id,''))}>↩ Back to pool</button></div>)}</div>}

 const report=async()=>{const {data,error}=await sb.from('trip_points').select('request_id,worker,lat,lng,created').gte('created',new Date(Date.now()-30*864e5).toISOString()).order('created').limit(20000);

   const day=new Date(ps[0].created).toLocaleDateString('en-CA'),k=day+'|'+(ps[0].worker||''),o=rows[k]=rows[k]||{day,w:ps[0].worker||'',km:0,n:0,mn:0,kg:0};o.km+=m/1000;o.n++;o.mn+=(new Date(ps[ps.length-1].created)-new Date(ps[0].created))/60000;if(rq&&rq.kg)o.kg+=Number(rq.kg)});
  dlCsv([['Date','Collector','Km driven','Pickups','Avg minutes per pickup','Kg collected']].concat(Object.values(rows).sort((a,b)=>a.day<b.day?1:-1).map(o=>[o.day,o.w,o.km.toFixed(1),o.n,Math.round(o.mn/o.n),o.kg])),'trip-report.csv')};

function NewPass({msg,setMsg,done}){
 const [a,setA]=useState('');const [b,setB]=useState('');
 const save=async()=>{if(a.length<6)return setMsg('Password must be at least 6 characters.');if(a!==b)return setMsg('Passwords do not match.');
  const {error}=await sb.auth.updateUser({password:a});if(error)return setMsg(errTxt(error));setMsg('Password updated.');done()};
 return <div className="wrap"><div className="auth"><div className="brand" style={{margin:'32px 0 18px'}}>{LOGO}{BRAND}</div>
  <div className="card"><h2>Choose a new password</h2>
   <label htmlFor="a1">New password</label><input id="a1" type="password" value={a} onChange={e=>setA(e.target.value)} autoComplete="new-password"/>
   <label htmlFor="a2">Confirm new password</label><input id="a2" type="password" value={b} onChange={e=>setB(e.target.value)} autoComplete="new-password"/>
   <button className="btn full" onClick={save}>Save password</button></div></div>{msg&&<div className="toast" role="status">{msg}</div>}</div>
}

function Setup(){return <div className="wrap"><div className="auth"><div className="brand" style={{margin:'32px 0 18px'}}>{LOGO}{BRAND}</div>
 <div className="card"><h2>Connect Supabase</h2><p>Open this file in a text editor, find <b>SUPABASE_URL</b> near the top of the script, and paste your Supabase project URL and public (anon) key. Add your OneSignal App ID too. See README.md.</p></div></div></div>}

function App(){
 const [session,setSession]=useState(undefined);
 const [user,setUser]=useState(undefined);
 const [recovery,setRecovery]=useState(false);
 const [reqs,setReqs]=useState([]);
 const [notes,setNotes]=useState([]);
 const [users,setUsers]=useState([]);
 const [pays,setPays]=useState([]);
 const [msg,setMsg]=useState('');
 const [pushOn,setPushOn]=useState(false);
 const st={reqs,notes,pays};
 const merge=row=>setReqs(p=>[toReq(row),...p.filter(x=>x.id!==row.id)].sort((a,b)=>b.created-a.created));
 const uid=session&&session.user.id;
 useEffect(()=>{if(!configured)return;
  sb.auth.getSession().then(({data})=>setSession(data.session));
  const {data:{subscription}}=sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')setRecovery(true);setSession(s)});
  return()=>subscription.unsubscribe()},[]);
 useEffect(()=>{if(!configured||session===undefined)return;
  if(!session){setUser(null);setReqs([]);setNotes([]);setUsers([]);setPays([]);return}
  let off=false;
  (async()=>{for(let i=0;i<5;i++){const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(off)return;if(data){if(data.blocked){setMsg('Your account has been blocked. Contact RayTECH.');sb.auth.signOut();return}setUser(data);return}await new Promise(r=>setTimeout(r,500))}
   setMsg('Account profile not found. Ask your manager for help.');sb.auth.signOut()})();
  return()=>{off=true}},[uid,session===undefined]);
 useEffect(()=>{if(!configured||!user)return;
  stopAllAlarms();let live=true;const mgr=user.role==='manager';
  sb.from('requests').select('*').order('created',{ascending:false}).then(({data,error})=>{if(!live)return;error?setMsg('Could not load pickups. Check your connection.'):(data.forEach(r=>{if(r.worker_id===user.id&&r.status==='assigned'&&!getAccepted().includes(r.id))startAlarm(r.id)}),setReqs(data.map(toReq)))});
  const loadUsers=()=>sb.from('profiles').select('*').order('name').then(({data})=>live&&data&&setUsers(data));
  if(mgr){
   sb.from('notifications').select('*').order('created',{ascending:false}).limit(50).then(({data})=>live&&data&&setNotes(data.map(toNote)));
   loadUsers()}
  let ch=sb.channel('rt-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'requests'},p=>{
   if(p.eventType==='DELETE'){stopAlarm(p.old.id);setReqs(prev=>prev.filter(x=>x.id!==p.old.id))}
   else{const n=p.new;
    if(n.worker_id===user.id&&n.status==='assigned'){if(!getAccepted().includes(n.id)&&!PENDING.has(n.id))startAlarm(n.id)}
    else if(n.status==='requested'&&n.offered_to&&n.offered_to.includes(user.id)){if(!PENDING.has(n.id))startAlarm(n.id)}
    else stopAlarm(n.id);
    merge(n)}});
  if(mgr)ch=ch.on('postgres_changes',{event:'*',schema:'public',table:'notifications'},p=>{
   if(p.eventType==='INSERT'&&!MYNOTES.has(p.new.text))chimeOnce();
   if(p.eventType!=='DELETE')setNotes(prev=>[toNote(p.new),...prev.filter(x=>x.id!==p.new.id)].sort((a,b)=>0).slice(0,50))})
   .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},loadUsers);
  ch.subscribe();let pch=null;
  sb.from('payments').select('*').order('created',{ascending:false}).then(({data,error})=>{if(!live||error||!data)return;setPays(data.map(toPay));
   pch=sb.channel('pay-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'payments'},p=>{if(p.eventType!=='DELETE')setPays(prev=>[toPay(p.new),...prev.filter(x=>x.id!==p.new.id)])}).subscribe()});
  return()=>{live=false;stopAllAlarms();sb.removeChannel(ch);pch&&sb.removeChannel(pch)}},[user&&user.id,user&&user.role]);
 useEffect(()=>{if(!configured||!user)return;
  const c=sb.channel('me-'+user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:'id=eq.'+user.id},p=>{const n=p.new;
   if(n.blocked){setMsg('Your account has been blocked. Contact RayTECH.');sb.auth.signOut()}else setUser(u=>({...u,...n}))}).subscribe();
  return()=>{sb.removeChannel(c)}},[user&&user.id]);
 useEffect(()=>{if(!configured||!user)return;
  const tick=()=>{sb.rpc('retry_unassigned').then(()=>{});
   if(user.role==='worker')sb.from('requests').select('*').order('created',{ascending:false}).then(({data})=>{if(!data)return;setReqs(data.map(toReq));
    const mine=r=>(r.status==='requested'&&(r.offered_to||[]).includes(user.id))||(r.worker_id===user.id&&r.status==='assigned'&&!r.accepted&&!getAccepted().includes(r.id));
    data.forEach(r=>{if(mine(r)&&!PENDING.has(r.id))startAlarm(r.id)});[...PENDING].forEach(id=>{if(!data.some(r=>r.id===id&&mine(r)))stopAlarm(id)})})};
  tick();const t=setInterval(tick,30000);return()=>clearInterval(t)},[user&&user.id,user&&user.role]);
 useEffect(()=>{if(!user||!PUSH)return;OneSignalDeferred.push(OS=>{OS.login(user.id);setPushOn(!!OS.Notifications.permission)})},[user&&user.id]);
 useEffect(()=>{ONDUTY=!!user&&user.role==='worker';if(ONDUTY)keepAlive();else try{KEEP&&KEEP.pause()}catch(e){}},[user&&user.id,user&&user.role]);
 useEffect(()=>{if(!msg)return;const t=setTimeout(()=>setMsg(''),3500);return()=>clearTimeout(t)},[msg]);
 const enablePush=()=>OneSignalDeferred.push(async OS=>{await OS.Notifications.requestPermission();const on=!!OS.Notifications.permission;setPushOn(on);setMsg(on?'Alerts turned on for this phone.':'Alerts are blocked. Allow notifications in your browser settings.')});
 const logout=async()=>{if(PUSH)OneSignalDeferred.push(OS=>OS.logout());await sb.auth.signOut()};
 const note=text=>{MYNOTES.add(text);sb.from('notifications').insert({text}).then(()=>{})};
 const fail=()=>setMsg('Something went wrong. Check your connection and try again.');
 const act={
  toast:setMsg,
  claim:async id=>{const {data,error}=await sb.rpc('claim_job',{p_request:String(id)});stopAlarm(id);if(error)return fail();
   if(!data){setReqs(p=>p.filter(x=>x.id!==id));return setMsg('Too late. Another collector took it, or you already have an active job.')}
   markAccepted(id);setMsg('Job accepted. Manager notified.');const {data:row}=await sb.from('requests').select('*').eq('id',id).single();if(row)merge(row)},
  decline:async id=>{stopAlarm(id);await sb.rpc('decline_job',{p_request:String(id)});setReqs(p=>p.filter(x=>x.id!==id));setMsg('Skipped. It goes to the next collector.')},
  rate:(id,n)=>sb.rpc('rate_pickup',{rid:String(id),stars:n}).then(({error})=>{if(error)setMsg('Rating saved on this phone only. Run medium-features.sql in Supabase once.')}),
  resched:async(id,slot)=>{const r=reqs.find(x=>x.id===id);const {error}=await sb.rpc('reschedule_pickup',{rid:String(id),new_slot:slot});if(error){setMsg('Could not change the time. Run medium-features.sql in Supabase once.');return false}
   setReqs(p=>p.map(x=>x.id===id?{...x,slot}:x));if(r)note(`${user.name} changed the pickup time at ${r.addr} to ${slot}.`);setMsg('Time updated.');return true},
  del:async ids=>{ids=[].concat(ids);let gone=[];
   for(let i=0;i<ids.length;i+=40){const part=ids.slice(i,i+40);
    const {data,error}=await sb.from('requests').delete().in('id',part).select('id');
    if(error)return setMsg('Could not delete. Check your connection and try again.');
    gone=gone.concat((data||[]).map(x=>x.id))}
   if(!gone.length)return setMsg('Nothing was deleted. Run fix-delete.sql in Supabase once, then try again.');
   gone.forEach(stopAlarm);setReqs(p=>p.filter(x=>!gone.includes(x.id)));
   sb.storage.from('proofs').remove(gone.map(i=>i+'.jpg')).then(()=>{});
   setMsg(gone.length===1?'Pickup deleted.':gone.length+' pickups deleted.')},
  accept:id=>{const r=reqs.find(x=>x.id===id);markAccepted(id);sb.rpc('accept_job',{p_request:String(id)}).then(()=>{});stopAlarm(id);if(r)note(`${r.worker||user.name} accepted the pickup at ${r.addr}.`);setMsg('Job accepted. Manager notified.')},
  add:async f=>{const row={uid:user.id,client:f.client,addr:f.addr,type:f.type,slot:f.slot,notes:f.notes,lat:f.lat,lng:f.lng};let {data,error}=await sb.from('requests').insert({...row,phone:f.phone||null}).select().single();
   if(error&&/phone/i.test(error.message||''))({data,error}=await sb.from('requests').insert(row).select().single());
   if(error)return fail();merge(data);sb.rpc('auto_assign',{p_request:String(data.id)}).then(({data:ok,error})=>{if(error)setMsg('Auto-assign error: '+(error.message||error.code)+'. Run auto-assign-fix2.sql in Supabase.');else setMsg(ok?'Pickup requested. Nearby collectors have been alerted.':'Pickup requested. No collector is online nearby yet. We will keep trying.')});note(`New pickup request from ${f.client}: ${f.type} at ${f.addr}.`);setMsg('Pickup requested. We will assign a collector soon.')},
  assign:async(id,name)=>{const w=users.find(u=>u.role==='worker'&&!u.blocked&&u.name===name);const r=reqs.find(x=>x.id===id);
   const {data,error}=await sb.from('requests').update({worker:w?w.name:null,worker_id:w?w.id:null,status:w?'assigned':'requested'}).eq('id',id).select().single();
   if(error)return fail();merge(data);if(w)note(`${w.name} assigned to ${r.addr}.`)},
  move:async(id,status,kg,photo)=>{const r=reqs.find(x=>x.id===id);try{
   let extra={};
   if(photo){const path=id+'.jpg';const up=await sb.storage.from('proofs').upload(path,await shrink(photo),{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;extra={proof_url:sb.storage.from('proofs').getPublicUrl(path).data.publicUrl+'?t='+Date.now()}}
   const {data,error}=await sb.from('requests').update({status,...(kg?{kg:Number(kg)}:{}),...extra}).eq('id',id).select().single();
   if(error)throw error;merge(data);
   note(status==='collected'?`${r.worker} collected ${kg} kg of ${r.type.toLowerCase()} waste at ${r.addr}.`:`${r.worker} is on the way to ${r.addr}.`);
   setMsg(status==='collected'?'Collected. Manager notified.':'Trip started. Client can now track you.')}catch(e){fail()}},
  alert:(k,t)=>{if(ALERTED[k]&&Date.now()-ALERTED[k]<600000)return;ALERTED[k]=Date.now();note(t)},
  crumb:(r,lat,lng)=>{sb.from('trip_points').insert({request_id:String(r.id),worker:r.worker,lat,lng}).then(()=>{})},
  problem:async(r,k,photo,p)=>{try{let u='';if(photo){const path='problem-'+r.id+'-'+Date.now()+'.jpg';const up=await sb.storage.from('proofs').upload(path,await shrink(photo),{contentType:'image/jpeg'});if(!up.error)u=' Photo: '+sb.storage.from('proofs').getPublicUrl(path).data.publicUrl}
   note(`⚠️ ${r.worker||user.name} reports: ${k} at ${r.addr}.`+(p?' Location: https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng:'')+u);setMsg('Problem sent to the manager.')}catch(e){fail()}},
  pos:(id,lat,lng)=>{const t=Date.now();if(t-lastPos<4000)return;lastPos=t;sb.from('requests').update({pos:{lat,lng,t}}).eq('id',id).then(()=>{})},
  read:()=>{setNotes(n=>n.map(x=>({...x,read:true})));sb.from('notifications').update({is_read:true}).eq('is_read',false).then(()=>{})},
  pay:async(r,d)=>{const {data,error}=await sb.from('payments').insert({request_id:String(r.id),client:r.client,amount:Number(d.amount),provider:d.provider,phone:d.phone,ref:d.ref}).select().single();
   if(error){const m=(error.message||'')+' '+(error.code||'');setMsg(/PGRST205|42P01|schema cache|does not exist/i.test(m)?'Payments table is missing. Run payments.sql in Supabase, then reload.':'Payment failed: '+(error.message||'unknown error'));return false}
   setPays(p=>[toPay(data),...p.filter(x=>x.id!==data.id)]);note(`${r.client} paid K${data.amount} via ${d.provider} (ID ${d.ref}) for ${r.addr}. Confirm it under Sales.`);setMsg('Payment sent. We will confirm it shortly.');return true},
  payOk:async(id,status)=>{const {data,error}=await sb.from('payments').update({status,confirmed:new Date().toISOString()}).eq('id',id).select().single();if(error)return fail();setPays(p=>p.map(x=>x.id===id?toPay(data):x));setMsg(status==='confirmed'?'Payment confirmed.':'Payment rejected.')},
  setRole:(id,role)=>sb.from('profiles').update({role}).eq('id',id).select().then(({data,error})=>{if(error||!data||!data.length)return setMsg('Could not change the role. Run block-users.sql in Supabase once.');setUsers(p=>p.map(x=>x.id===id?{...x,...data[0]}:x));setMsg('Role updated.')}),
  block:(id,b)=>sb.from('profiles').update({blocked:b}).eq('id',id).select().then(({data,error})=>{if(error||!data||!data.length)return setMsg('Could not update. Run block-users.sql in Supabase once.');setUsers(p=>p.map(x=>x.id===id?{...x,...data[0]}:x));setMsg(b?'User blocked.':'User unblocked.')})
 };
 if(!configured)return <Setup/>;
 if(recovery&&session)return <NewPass msg={msg} setMsg={setMsg} done={()=>setRecovery(false)}/>;
 if(session===undefined||(session&&user===undefined))return <div className="wrap"><div className="empty">Loading…</div></div>;
 if(!session||!user)return <Auth msg={msg} setMsg={setMsg}/>;
 const unread=notes.filter(n=>!n.read).length;
 return <div className="wrap">
  <header><div className="brand">{LOGO}{BRAND}</div>
   <div style={{textAlign:'right'}}><div className="mute">{user.name} · {ROLE[user.role]}</div><button className="btn alt sm" onClick={logout}>Log out</button></div></header>
  {PUSH&&!pushOn&&<div className="card row" style={{alignItems:'center'}}><span>Get alerts on this phone, even when the app is closed.</span><button className="btn sm" onClick={enablePush}>Turn on alerts</button></div>}
  {user.role==='manager'&&unread>0&&<div className="card" role="status"><b>{unread} new notification{unread>1?'s':''}</b></div>}
  {user.role==='client'&&<Client st={st} act={act} user={user}/>}
  {user.role==='worker'&&<Worker st={st} act={act} user={user}/>}
  {user.role==='manager'&&<Manager st={st} act={act} users={users} me={user.id}/>}
  {msg&&<div className="toast" role="status">{msg}</div>}
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
